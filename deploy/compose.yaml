services:
  school:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      SCHOOL_HOST: 0.0.0.0
      SCHOOL_DB: /app/data/school.sqlite
      SCHOOL_SECURE: "1"
      SCHOOL_FONT_DIR: /app/fonts
    volumes:
      - school-data:/app/data
      - ./fonts:/app/fonts:ro
      - ./backups:/app/backups
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    env_file: ../.env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [school]
    restart: unless-stopped
volumes:
  school-data:
  caddy-data:
  caddy-config:
