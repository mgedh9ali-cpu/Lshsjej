services:
  classroom:
    build: .
    env_file: .env
    volumes:
      - classroom-data:/app/data
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      QUM_DOMAIN: ${QUM_DOMAIN:?Set the classroom hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - classroom
    restart: unless-stopped
volumes:
  classroom-data:
  certificates:
  proxy-config:
