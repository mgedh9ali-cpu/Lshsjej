name = "qum-dorous"
main = "worker.mjs"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "qum-dorous"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[ratelimits]]
name = "STUDENT_RATE"
namespace_id = "71040516"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "SUGGESTION_RATE"
namespace_id = "71040517"
simple = { limit = 8, period = 60 }
