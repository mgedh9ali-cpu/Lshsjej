name: Android apps - validate and package

on:
  push:
    branches: [build/android-0.7.7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check android/room/room.js
          node --check android/room/library.js
          node --check android/offline/source.js
          bash -n android/build.sh
      - name: Test Android packaging configuration
        run: npm test
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCHOOL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SCHOOL_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          export SCHOOL_KEYSTORE="$RUNNER_TEMP/signing/school.keystore"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$SCHOOL_KEYSTORE"
            printf 'SCHOOL_SIGN_MODE=release\n' >> "$GITHUB_ENV"
            printf 'SCHOOL_KEY_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$SCHOOL_KEYSTORE" -storepass androidtest -keypass androidtest \
              -alias dafaa -keyalg RSA -keysize 3072 -validity 1000 -dname "CN=Qum Dorous Preview"
            printf 'SCHOOL_SIGN_MODE=preview\n' >> "$GITHUB_ENV"
            printf 'SCHOOL_KEY_PASSWORD=androidtest\n' >> "$GITHUB_ENV"
          fi
          printf 'SCHOOL_KEYSTORE=%s\n' "$SCHOOL_KEYSTORE" >> "$GITHUB_ENV"
          printf 'SCHOOL_KEY_ALIAS=dafaa\n' >> "$GITHUB_ENV"
      - name: Build Android student application
        run: |
          mkdir -p dist
          bash android/build.sh dist/QumDorous-Student-0.7.7.apk student
      - name: Build Android owner application
        run: bash android/build.sh dist/QumDorous-Owner-0.7.7.apk owner
      - name: Verify Android packages
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          for edition in Student Owner; do
            apk="dist/QumDorous-$edition-0.7.7.apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            package=school.dafaa
            [[ "$edition" != Owner ]] || package=school.dafaa.owner
            "$build_tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
            grep -F "package: name='$package' versionCode='20' versionName='0.7.7'" "$RUNNER_TEMP/apk-badging.txt"
            unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
            for asset in room.html room.js room.css core.js models.js student.sqlite cairo.woff2; do
              grep -Fx "assets/$asset" "$RUNNER_TEMP/apk-files.txt"
            done
            if grep -Ex 'assets/(student-origin.txt|admin.html|student.html)' "$RUNNER_TEMP/apk-files.txt"; then exit 1; fi
          done
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Save both APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QumDorous-Android-0.7.7-${{ env.SCHOOL_SIGN_MODE }}
          path: dist/
          if-no-files-found: error
