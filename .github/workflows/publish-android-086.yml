name: Publish verified Android 0.8.6
on:
  push:
    branches: [distribution/android-0.8.6]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK hashes
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-0.8.6 release-assets/*.apk release-assets/SHA256SUMS.txt \
            --target '69b43d3ee0de598ecd5236ee0542208c902c586b' --title 'قو دروس 0.8.6' \
            --notes 'معاينة وتكبير الصور، وقائمة تنزيل وتعديل وحذف حسب الصلاحيات، وعرض المصادر المنشورة قبل انضمام الطالب.'
