name: Publish verified Android 0.8.5
on:
  push:
    branches: [distribution/android-0.8.5]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published APK hashes
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-0.8.5 release-assets/*.apk release-assets/SHA256SUMS.txt \
            --target '69b3e6b2dc72f9f350b27cd9a85176f4e67becff' --title 'قوم دروس 0.8.5' \
            --notes 'تحديث موقّع بشهادة 0.8.4. لربط الطالب بالصف، أدخل رمز الدعوة من الإعدادات. تُعتمد هواتف المالك من لوحة الدعوات المحمية.'
