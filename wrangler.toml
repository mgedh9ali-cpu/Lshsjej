name = "lshsjej"
main = "cloud/worker.mjs"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "suggestions-db"
database_id = "123d5d0c-1fff-45c4-b834-352be7dbb307"

[[ratelimits]]
name = "STUDENT_RATE"
namespace_id = "71040516"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "SUGGESTION_RATE"
namespace_id = "71040517"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "SUGGESTION_IP_RATE"
namespace_id = "71040518"
simple = { limit = 60, period = 60 }

[vars]
QUM_MAX_STUDENTS = "200"
